{{ template "header.html" }}
<div id="app">
    <div class="container py-4 px-3 mx-auto">
    <div class="form-container">
        <h2>ThousandEyes PoV Visualizer - {{ .topic }}</h2>
        <div class="form-floating mb-3">
            <input type="text" id="userInput" name="userInput" size="40" placeholder="Bearer Token" required>
            <button type="button" id="getAG">Get Account-Groups</button>
        </div>
        <div id="dropdown" class="justify-content-center d-none">
            <label for="dropdown">Account Groups:</label>
            <select id="ag" name="ag"></select>
        </div>
        <button id="labelBtn" class="d-none">Get Labels</button>
        <div id="dropdownLabel" class="justify-content-center d-none">
            <label for="dropdown">Labels:</label>
            <select id="label" name="label"></select>
        </div>

        <div id="graphSettings" class="d-none">
            <hr>
            <fieldset class="radio-group">
                <legend style="font-weight: 600; font-size: 1rem; margin-bottom: 0.5rem; color: var(--midnight-blue);">Graph Settings</legend>
                <p>Direction:</p>
                <div class="form-check">
                    <input class="form-check-input" type="radio" value="LR" name="radioDirection" id="radioDirection1" checked>
                    <label class="form-check-label" for="radioDefault1">Left-to-Right</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" value="TD" name="radioDirection" id="radioDirection2">
                    <label class="form-check-label" for="radioDefault2">Top-Down</label>
                </div>
                <br>
                <p>Look:</p>
                <div class="form-check">
                    <input class="form-check-input" type="radio" value="classic" name="radioLook" id="radioLookClassic" checked>
                    <label class="form-check-label" for="radioLookClassic">classic</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" value="dark" name="radioLook" id="radioLookDark">
                    <label class="form-check-label" for="radioLookDark">dark</label>
                </div>
            </fieldset>
        </div>
        <button id="diagramBtn" class="d-none">Create Diagram</button>
        <div class="d-flex justify-content-center d-none" id="loading-spinner">
            <div class="spinner-border" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>
        <div id="mermaidCard" class="card"></div>
        <div id="network-container" style="height:800px;width:100%;"></div>
    </div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
  var endpointGraph = {
    nodes: [
      { id: "A", label: "Endpoint Agent\nDWOELLHA-M-3HQT\nStuttgart, Germany", group: "agent" },
      { id: "T169647", label: "Attendee Dashboard\nhttp-server · reg.rainfocus.com", group: "test" },
      { id: "T113883", label: "CLUSA Speaker Resource Centre\nhttp-server · reg.rainfocus.com", group: "test" },
      { id: "T256824", label: "Microsoft Teams\nhttp-server · teams.microsoft.com", group: "test" },
      { id: "T197124", label: "Stuttgart – Default Gateway\nagent-to-server · 10.1.17.1", group: "test" },
      { id: "T347759", label: "Webex\nhttp-server · cisco.webex.com", group: "test" },
      { id: "T370262", label: "webhook.site\nhttp-server · webhook.site", group: "test" },
      { id: "T113337", label: "Cisco Live\nhttp-server · www.ciscolive.com", group: "test" },
      { id: "T133395", label: "www.cisco.com\nhttp-server · www.cisco.com", group: "test" }
    ],
    edges: [
      { from: "A", to: "T169647" },
      { from: "A", to: "T113883" },
      { from: "A", to: "T256824" },
      { from: "A", to: "T197124" },
      { from: "A", to: "T347759" },
      { from: "A", to: "T370262" },
      { from: "A", to: "T113337" },
      { from: "A", to: "T133395" }
    ]
  };

  function paintEndpointGraph() {
    if (typeof tevisTopologyInit !== "function") return;
    var dirEl = document.querySelector('input[name="radioDirection"]:checked');
    var lookEl = document.querySelector('input[name="radioLook"]:checked');
    tevisTopologyInit("network-container", {
      graphDirection: dirEl ? dirEl.value : "LR",
      visDarkBackground: lookEl ? lookEl.value === "dark" : true
    }, endpointGraph);
  }

  paintEndpointGraph();
  document.querySelectorAll('input[name="radioDirection"], input[name="radioLook"]').forEach(function (el) {
    el.addEventListener("change", paintEndpointGraph);
  });
});
</script>
{{ template "footer.html" }}
